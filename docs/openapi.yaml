          description: job_posting_id
      responses:
        '200':
          description: List of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/recruitment/offers:
    post:
      tags: [Recruitment]
      summary: Create job offer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id, position_title]
              properties:
                application_id: { type: string, format: uuid }
                position_title: { type: string }
                department_id: { type: string, format: uuid }
                start_date: { type: string, format: date }
                employment_type: { type: string }
                work_mode: { type: string }
                salary_amount: { type: number }
                salary_currency: { type: string }
                salary_period: { type: string, enum: [MONTHLY, ANNUAL, WEEKLY, HOURLY] }
                benefits: { type: string }
                conditions: { type: string }
                response_deadline: { type: string, format: date }
      responses:
        '201': { description: Offer created }

  /api/v1/recruitment/offers/{id}:
    get:
      tags: [Recruitment]
      summary: Get offer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Offer }
        '404': { description: Not found }

  /api/v1/recruitment/offers/{id}/send:
    post:
      tags: [Recruitment]
      summary: Send offer to candidate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Sent }

  /api/v1/recruitment/offers/{id}/accept:
    post:
      tags: [Recruitment]
      summary: Accept offer (converts to HIRED)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Accepted }

  /api/v1/recruitment/offers/{id}/reject:
    post:
      tags: [Recruitment]
      summary: Reject offer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Rejected }

  /api/v1/recruitment/referrals:
    get:
      tags: [Recruitment]
      summary: List employee referrals
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of referrals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Recruitment]
      summary: Create employee referral
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id]
              properties:
                candidate_id: { type: string, format: uuid }
                notes: { type: string }
      responses:
        '201': { description: Referral created }

  /api/v1/recruitment/dashboard:
    get:
      tags: [Recruitment]
      summary: Get recruitment dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recruitment dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      open_requisitions: { type: integer }
                      total_candidates: { type: integer }
                      applications_this_week: { type: integer }
                      pending_offers: { type: integer }
                      hires_this_month: { type: integer }
                      total_interviews: { type: integer }
                      avg_time_to_hire: { type: number }
                      funnel_by_stage:
                        type: array
                        items:
                          type: object
                          properties:
                            stage: { type: string }
                            count: { type: integer }
