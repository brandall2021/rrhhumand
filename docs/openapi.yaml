                weekly_hours: { type: integer }
                days:
                  type: array
                  items:
                    type: object
                    properties:
                      weekday: { type: integer, minimum: 0, maximum: 6 }
                      is_working_day: { type: boolean }
                      start_time: { type: string, example: "09:00:00" }
                      end_time: { type: string, example: "17:00:00" }
                      break_minutes: { type: integer }
                      intervals:
                        type: array
                        items:
                          type: object
                          properties:
                            start_time: { type: string }
                            end_time: { type: string }
