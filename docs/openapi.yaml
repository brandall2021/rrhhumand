openapi: 3.0.3
info:
  title: RRHHumand API
  description: |
    Multi-tenant Employee Management Platform API.
    Human Resources SaaS with modular monolith architecture.
  version: 1.0.0
  contact:
    name: RRHHumand Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Health
    description: Health and readiness probes
  - name: Auth
    description: Authentication and token management
  - name: Companies
    description: Company management (tenants)
  - name: Branches
    description: Company branches
  - name: Departments
    description: Company departments
  - name: Positions
    description: Job positions
  - name: Employees
    description: Employee management
  - name: Organization
    description: Organization chart
  - name: Profile
    description: Current user profile
  - name: Feed
    description: Corporate social feed
  - name: Surveys
    description: Internal surveys module
  - name: Documents
    description: Document management with MinIO storage
  - name: Document Categories
    description: Document category management
  - name: Document Tags
    description: Document tag management
  - name: Leave Types
    description: Leave type management
  - name: Leave Policies
    description: Leave policy management
  - name: Leave Balances
    description: Employee leave balance management
  - name: Leave Requests
    description: Leave/vacation request management
  - name: Leave Calendar
    description: Absence calendar view
  - name: Leave Reports
    description: Leave reporting and analytics
  - name: Holidays
    description: Holiday management
  - name: Attendance
    description: Attendance and time tracking
  - name: Attendance Policies
    description: Attendance policy configuration
  - name: Attendance Corrections
    description: Attendance correction requests
  - name: Performance Cycles
    description: Evaluation cycle management
  - name: Performance Templates
    description: Evaluation template management
  - name: Performance Scales
    description: Rating scale configuration
  - name: Performance Competencies
    description: Competency management
  - name: Performance Objectives
    description: Employee objectives (SMART goals)
  - name: Performance KPIs
    description: Key Performance Indicators
  - name: Performance Evaluators
    description: Evaluator assignment (360°)
  - name: Performance Evaluations
    description: Evaluation management and submission
  - name: Performance Feedback
    description: Continuous feedback
  - name: Performance Results
    description: Score calculation and results
  - name: Performance Scoring
    description: Scoring rules and weight configuration
  - name: Performance Improvement Plans
    description: Improvement plans management
  - name: Performance Development Plans
    description: Individual development plans
  - name: Performance
    description: Performance dashboard and reports

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Survey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [GENERAL, CLIMATE, SATISFACTION, FEEDBACK, PULSE, TRAINING, INTERNAL]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED, ARCHIVED]
        anonymous:
          type: boolean
        multiple_responses:
          type: boolean
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_by_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SurveyTarget'
        response_count:
          type: integer
        target_count:
          type: integer
        participation_rate:
          type: number

    SurveyQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        survey_id:
          type: string
          format: uuid
        question:
          type: string
        type:
          type: string
          enum: [TEXT, SINGLE_CHOICE, MULTIPLE_CHOICE, RATING, YES_NO, NUMBER]
        position:
          type: integer
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/SurveyOption'

    SurveyOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        option_text:
          type: string
        position:
          type: integer

    SurveyTarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        survey_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [ALL, DEPARTMENT, BRANCH, POSITION, EMPLOYEE]
        target_id:
          type: string
          format: uuid

    SurveyStats:
      type: object
      properties:
        total_targeted:
          type: integer
        total_responded:
          type: integer
        participation_rate:
          type: number
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionStats'

    QuestionStats:
      type: object
      properties:
        question_id:
          type: string
        question:
          type: string
        type:
          type: string
        total_answers:
          type: integer
        average:
          type: number
        min:
          type: number
        max:
          type: number
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/OptionDistribution'
        yes_count:
          type: integer
        no_count:
          type: integer
        yes_percentage:
          type: number
        sample_texts:
          type: array
          items:
            type: string

    OptionDistribution:
      type: object
      properties:
        option_id:
          type: string
        option_text:
          type: string
        count:
          type: integer
        percentage:
          type: number

    CreateSurveyRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [GENERAL, CLIMATE, SATISFACTION, FEEDBACK, PULSE, TRAINING, INTERNAL]
        anonymous:
          type: boolean
        multiple_responses:
          type: boolean
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    CreateQuestionRequest:
      type: object
      required: [question, type]
      properties:
        question:
          type: string
        type:
          type: string
          enum: [TEXT, SINGLE_CHOICE, MULTIPLE_CHOICE, RATING, YES_NO, NUMBER]
        position:
          type: integer
        required:
          type: boolean

    CreateOptionRequest:
      type: object
      required: [option_text]
      properties:
        option_text:
          type: string
        position:
          type: integer

    SetTargetsRequest:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            required: [target_type]
            properties:
              target_type:
                type: string
                enum: [ALL, DEPARTMENT, BRANCH, POSITION, EMPLOYEE]
              target_id:
                type: string
                format: uuid

    RespondSurveyRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id:
                type: string
                format: uuid
              text:
                type: string
              number:
                type: number
              option_id:
                type: string
                format: uuid
              option_ids:
                type: array
                items:
                  type: string
                  format: uuid

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        '200':
          description: Service is ready

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '401':
          description: Invalid refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info

  /companies:
    get:
      tags: [Companies]
      summary: List companies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of companies
    post:
      tags: [Companies]
      summary: Create company
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Company created

  /companies/{id}:
    get:
      tags: [Companies]
      summary: Get company by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company details
    put:
      tags: [Companies]
      summary: Update company
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Company updated

  /branches:
    get:
      tags: [Branches]
      summary: List branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/schemas/PaginationMeta'
      responses:
        '200':
          description: List of branches
    post:
      tags: [Branches]
      summary: Create branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Branch created

  /branches/{id}:
    get:
      tags: [Branches]
      summary: Get branch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch details

  /departments:
    get:
      tags: [Departments]
      summary: List departments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments
    post:
      tags: [Departments]
      summary: Create department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Department created

  /positions:
    get:
      tags: [Positions]
      summary: List positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of positions
    post:
      tags: [Positions]
      summary: Create position
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Position created

  /employees:
    get:
      tags: [Employees]
      summary: List employees
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: department_id
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of employees
    post:
      tags: [Employees]
      summary: Create employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Employee created

  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get employee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee details

  /employees/{id}/contacts:
    get:
      tags: [Employees]
      summary: Get employee contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee contacts
    put:
      tags: [Employees]
      summary: Upsert employee contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
      responses:
        '200':
          description: Contacts updated

  /employees/{id}/addresses:
    get:
      tags: [Employees]
      summary: Get employee addresses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee addresses

  /employees/{id}/emergency-contacts:
    get:
      tags: [Employees]
      summary: Get employee emergency contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Emergency contacts

  /employees/{id}/history:
    get:
      tags: [Employees]
      summary: Get employee history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee history

  /organization/tree:
    get:
      tags: [Organization]
      summary: Get organization tree
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization tree

  /me/profile:
    get:
      tags: [Profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
    put:
      tags: [Profile]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated

  /feed:
    get:
      tags: [Feed]
      summary: List feed posts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of posts
    post:
      tags: [Feed]
      summary: Create post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                visibility:
                  type: string
                pinned:
                  type: boolean
      responses:
        '201':
          description: Post created

  /feed/{id}:
    get:
      tags: [Feed]
      summary: Get post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details
    put:
      tags: [Feed]
      summary: Update post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Post updated
    delete:
      tags: [Feed]
      summary: Delete post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Post deleted

  /feed/{id}/comments:
    post:
      tags: [Feed]
      summary: Add comment to post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parent_id:
                  type: string
      responses:
        '201':
          description: Comment added

  /feed/{id}/reactions:
    post:
      tags: [Feed]
      summary: Add reaction to post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction_type]
              properties:
                reaction_type:
                  type: string
      responses:
        '200':
          description: Reaction added

  /feed/{id}/reactions/{type}:
    delete:
      tags: [Feed]
      summary: Remove reaction from post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reaction removed

  /surveys:
    get:
      tags: [Surveys]
      summary: List surveys
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, CLOSED, ARCHIVED]
        - name: type
          in: query
          schema:
            type: string
            enum: [GENERAL, CLIMATE, SATISFACTION, FEEDBACK, PULSE, TRAINING, INTERNAL]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of surveys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Survey'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Surveys]
      summary: Create survey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Survey'

  /surveys/{id}:
    get:
      tags: [Surveys]
      summary: Get survey with questions and targets
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Survey details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Survey'
        '404':
          description: Survey not found
    put:
      tags: [Surveys]
      summary: Update survey (DRAFT only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Survey updated
        '400':
          description: Survey not editable
    delete:
      tags: [Surveys]
      summary: Delete survey (DRAFT only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Survey deleted
        '400':
          description: Only draft surveys can be deleted

  /surveys/{id}/publish:
    post:
      tags: [Surveys]
      summary: Publish survey (DRAFT -> PUBLISHED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Survey published
        '400':
          description: Invalid transition or no questions

  /surveys/{id}/close:
    post:
      tags: [Surveys]
      summary: Close survey (PUBLISHED -> CLOSED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Survey closed
        '400':
          description: Invalid transition

  /surveys/{id}/archive:
    post:
      tags: [Surveys]
      summary: Archive survey (CLOSED -> ARCHIVED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Survey archived
        '400':
          description: Invalid transition

  /surveys/{id}/questions:
    get:
      tags: [Surveys]
      summary: List survey questions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of questions
    post:
      tags: [Surveys]
      summary: Add question to survey
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Question added

  /surveys/questions/{id}:
    put:
      tags: [Surveys]
      summary: Update question
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Question updated
    delete:
      tags: [Surveys]
      summary: Delete question
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
